name: tpu-info CI

on:
  push:
    branches:
      - main
    paths:
      - "tpu_info/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tpu_info/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with [build-system] requires in tpu_info/pyproject.toml so the
  # protos compiled for unit tests use the same gencode as the published wheel.
  GRPCIO_TOOLS_SPEC: "grpcio-tools>=1.65.5,<1.72.0"
  # Runtime versions shipped on Cloud TPU JAX images. The built wheel must
  # import cleanly against these.
  CLOUD_TPU_RUNTIME_SPEC: "grpcio==1.75.0 protobuf==6.32.1"

jobs:
  test-and-package:
    name: Test & Package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: tpu_info

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: tpu_info/pyproject.toml

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest "${GRPCIO_TOOLS_SPEC}"
          python -m pip install -e ".[test]"

      - name: Compile protobuf definitions
        run: |
          python -m grpc_tools.protoc --experimental_editions -I. tpu_info/proto/tpu_metric_service.proto --python_out=. --pyi_out=. --grpc_python_out=.
          python -m grpc_tools.protoc --experimental_editions -I. tpu_info/proto/tpu_telemetry.proto --python_out=. --pyi_out=.

      - name: Check Python syntax
        run: |
          python -m py_compile tpu_info/*.py tpu_info/providers/*.py tpu_info/proto/*.py

      - name: Run unit tests (absltest runner)
        run: |
          shopt -s nullglob
          tests=(tpu_info/*_test.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::No tpu_info/*_test.py files found; unit tests must not be skipped."
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            echo "=== Running ${test_file} ==="
            python "${test_file}"
          done

      - name: Run unit tests (pytest runner)
        run: |
          shopt -s nullglob
          tests=(tpu_info/*_test.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::No tpu_info/*_test.py files found; unit tests must not be skipped."
            exit 1
          fi
          pytest -v "${tests[@]}"

      - name: Build package (wheel and sdist)
        run: |
          python -m build
          twine check dist/*

      - name: Verify wheel installation and CLI baseline
        run: |
          python -m pip uninstall -y tpu-info
          # Clean local generated proto files to ensure wheel bundles them properly
          rm -f tpu_info/proto/*_pb2*.py tpu_info/proto/*_pb2*.pyi
          python -m pip install dist/*.whl
          # Run CLI outside source tree so imports resolve from installed wheel
          cd /tmp
          tpu-info --help
          tpu-info --version
          tpu-info query --list-metrics

      - name: Check wheel against Cloud TPU runtime versions
        run: |
          python -m venv /tmp/cloud-tpu-runtime
          /tmp/cloud-tpu-runtime/bin/python -m pip install --upgrade pip
          # shellcheck disable=SC2086
          /tmp/cloud-tpu-runtime/bin/python -m pip install dist/*.whl ${CLOUD_TPU_RUNTIME_SPEC}
          cd /tmp
          /tmp/cloud-tpu-runtime/bin/python -c "from tpu_info.proto import tpu_metric_service_pb2, tpu_metric_service_pb2_grpc, tpu_telemetry_pb2"
          /tmp/cloud-tpu-runtime/bin/tpu-info --version
